name: Create achievement Q&A discussions

on:
  workflow_dispatch:

permissions:
  discussions: write

jobs:
  create-discussions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const data = await github.graphql(`
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  id
                  discussionCategories(first: 20) {
                    nodes { id slug isAnswerable }
                  }
                }
              }
            `, { owner: context.repo.owner, name: context.repo.repo });
            const category = data.repository.discussionCategories.nodes.find(
              item => item.slug === "q-a" && item.isAnswerable
            );
            const questions = [
              {
                title: "Which tests should contributors run before opening a pull request?",
                body: "What is the standard offline verification command for this repository?"
              },
              {
                title: "Where are the local API and Temporal interfaces exposed?",
                body: "After starting the complete stack, which local URLs expose the API documentation and Temporal UI?"
              }
            ];
            for (const question of questions) {
              await github.graphql(`
                mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                  createDiscussion(input: {
                    repositoryId: $repositoryId,
                    categoryId: $categoryId,
                    title: $title,
                    body: $body
                  }) { discussion { number url } }
                }
              `, {
                repositoryId: data.repository.id,
                categoryId: category.id,
                title: question.title,
                body: question.body
              });
            }
